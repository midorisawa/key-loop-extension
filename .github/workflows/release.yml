name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag must match manifest.json version: v$version"
            exit 1
          fi

      - name: Create ZIP
        run: |
          zip -r key-loop-extension.zip manifest.json *.js *.html *.css icons README.md LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" key-loop-extension.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" key-loop-extension.zip \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
