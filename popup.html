<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>キー変更・ループ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>キー変更・ループ</h1>
  </header>

  <section aria-label="キー変更">
    <label for="capture">
      キー変更
      <input id="capture" type="checkbox" role="switch" disabled>
    </label>
    <fieldset id="audioSettings" disabled>
      <label for="pitch">
        キー
        <output id="pitchValue">0半音</output>
      </label>
      <input id="pitch" type="range" min="-12" max="12" value="0" step="1">
      <div class="scale">
        <span>−12</span>
        <span>0</span>
        <span>+12</span>
      </div>
    </fieldset>
  </section>

  <section aria-label="再生操作">
    <label>区間ループ <span id="position">--:--</span></label>
    <div class="loop">
      <button id="setA">Aを設定</button>
      <button id="setB">Bを設定</button>
      <button id="loop" aria-label="区間ループ" aria-pressed="false" title="区間ループ" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/>
        </svg>
      </button>
    </div>
    <p id="bounds" class="hint">開始位置A → 終了位置Bの順に設定</p>
  </section>

  <footer>
    <button id="reset">設定をリセット</button>
    <p id="status" role="status" aria-live="polite"></p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
